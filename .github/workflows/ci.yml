name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (shared fixtures included)
        run: ./gradlew :shield:testDebugUnitTest --stacktrace
      - name: Release AAR
        run: ./gradlew :shield:assembleRelease
      - name: Android lint
        run: ./gradlew :shield:lintRelease
      - name: Demo app builds and passes lint
        run: ./gradlew :shield-demo:assembleDebug :shield-demo:lintDebug
      - name: Demo backend starts and checks its key
        run: |
          node --check examples/shield-demo/server/server.mjs
          if SHIELD_SECRET_KEY= node examples/shield-demo/server/server.mjs; then echo "should refuse to start without a key"; exit 1; fi
      - name: AAR size under 300 KB
        run: |
          size=$(stat -c %s shield/build/outputs/aar/shield-release.aar)
          echo "AAR: $size bytes"
          test "$size" -lt 307200
      - name: Maven publication (local) has every file Central requires
        run: |
          ./gradlew :shield:publishToMavenLocal --no-configuration-cache
          v=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          d=~/.m2/repository/net/findip/shield-android/$v
          ls -l "$d"
          for f in shield-android-$v.aar shield-android-$v.pom shield-android-$v-sources.jar shield-android-$v-javadoc.jar shield-android-$v.module; do
            test -s "$d/$f" || { echo "missing $f"; exit 1; }
          done
          grep -q '<artifactId>kotlinx-coroutines-core</artifactId>' "$d/shield-android-$v.pom"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the stand-in for Shield and the demo backend
        working-directory: examples/shield-demo
        run: |
          EVENTS_FILE=events.jsonl nohup node ci/fake-shield.mjs > fake-shield.log 2>&1 &
          SHIELD_SECRET_KEY=sec_citest SHIELD_VERIFY_URL=http://localhost:8788/v1/shield/sessions/verify nohup node server/server.mjs > backend.log 2>&1 &
          for port in 8787 8788; do
            for i in $(seq 1 30); do curl -sf localhost:$port/health >/dev/null && break; sleep 1; done
            curl -sf localhost:$port/health
          done
          printf 'shield.siteKey=pub_citest0000000000\nshield.endpoint=http://10.0.2.2:8788/v1/shield/track\n' > ../../local.properties
      - name: Demo app runs on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew :shield-demo:connectedDebugAndroidTest --stacktrace
            adb logcat -d -s FindIPShield > examples/shield-demo/sdk.log
      - name: What the app sent, and the lifecycle reaching the SDK
        working-directory: examples/shield-demo
        run: |
          node ci/check-events.mjs events.jsonl android
          grep -q 'app in the background' sdk.log
          grep -q 'app in the foreground: session kept' sdk.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            shield/build/reports
            examples/shield-demo/build/reports
            examples/shield-demo/events.jsonl
            examples/shield-demo/sdk.log
