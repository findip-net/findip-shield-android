name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (shared fixtures included)
        run: ./gradlew :shield:testDebugUnitTest --stacktrace
      - name: Release AAR
        run: ./gradlew :shield:assembleRelease
      - name: Android lint
        run: ./gradlew :shield:lintRelease
      - name: AAR size under 300 KB
        run: |
          size=$(stat -c %s shield/build/outputs/aar/shield-release.aar)
          echo "AAR: $size bytes"
          test "$size" -lt 307200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: shield/build/reports
