name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (shared fixtures included)
        run: ./gradlew :shield:testDebugUnitTest --stacktrace
      - name: Release AAR
        run: ./gradlew :shield:assembleRelease
      - name: Android lint
        run: ./gradlew :shield:lintRelease
      - name: AAR size under 300 KB
        run: |
          size=$(stat -c %s shield/build/outputs/aar/shield-release.aar)
          echo "AAR: $size bytes"
          test "$size" -lt 307200
      - name: Maven publication (local) has every file Central requires
        run: |
          ./gradlew :shield:publishToMavenLocal --no-configuration-cache
          v=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          d=~/.m2/repository/net/findip/shield-android/$v
          ls -l "$d"
          for f in shield-android-$v.aar shield-android-$v.pom shield-android-$v-sources.jar shield-android-$v-javadoc.jar shield-android-$v.module; do
            test -s "$d/$f" || { echo "missing $f"; exit 1; }
          done
          grep -q '<artifactId>kotlinx-coroutines-core</artifactId>' "$d/shield-android-$v.pom"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: shield/build/reports
