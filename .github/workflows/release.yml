name: Release

# Runs when a GitHub release is published (tag v<VERSION_NAME>), or by hand for
# an existing tag (for example to publish v1.0.0 to Maven Central once the
# secrets below exist).
#
# Maven Central needs four repository secrets; without them this workflow
# still attaches the AAR to the release and skips Central with a notice:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  user token from central.sonatype.com (namespace net.findip)
#   SIGNING_KEY / SIGNING_KEY_PASSWORD               ASCII-armored GPG private key and its passphrase

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tag matches VERSION_NAME
        run: |
          v=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          test "$TAG" = "v$v" || { echo "tag $TAG does not match VERSION_NAME $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Test and build the release AAR
        run: ./gradlew :shield:testDebugUnitTest :shield:assembleRelease

      - name: Attach the AAR to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp shield/build/outputs/aar/shield-release.aar "shield-android-$VERSION.aar"
          sha256sum "shield-android-$VERSION.aar" > "shield-android-$VERSION.aar.sha256"
          gh release upload "$TAG" "shield-android-$VERSION.aar" "shield-android-$VERSION.aar.sha256" --clobber

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "::notice::Maven Central secrets are not set: the AAR is on the release; Central publication skipped."
            exit 0
          fi
          ./gradlew :shield:publishAndReleaseToMavenCentral --no-configuration-cache
